name: Release Jetty HTTP Backport

on:
  push:
    tags:
      - "v9.4.60.v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 9.4.60.v20260421"
        required: true
        default: "9.4.60.v20260421"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          else
            RAW_VERSION="${GITHUB_REF_NAME}"
          fi
          PATCH_VERSION="${RAW_VERSION#v}"
          echo "PATCH_VERSION=${PATCH_VERSION}" >> "${GITHUB_ENV}"
          echo "Patch version: ${PATCH_VERSION}"

      - name: Build module and run parser tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -Pfast -pl build-resources -DskipTests install
          mvn -pl jetty-http -Dtest=HttpParserTest -Denforcer.skip=true -Dcheckstyle.skip=true test
          mvn -pl jetty-http -Denforcer.skip=true -Dcheckstyle.skip=true -DskipTests package

      - name: Repackage jar with patched version metadata
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>([^<]+)<.*/\1/')"
          SRC_JAR="jetty-http/target/jetty-http-${BASE_VERSION}.jar"
          OUT_JAR="/tmp/jetty-http-${PATCH_VERSION}.jar"
          WORK_DIR="/tmp/jetty-http-work"

          rm -rf "${WORK_DIR}"
          mkdir -p "${WORK_DIR}"
          cd "${WORK_DIR}"
          jar xf "${GITHUB_WORKSPACE}/${SRC_JAR}"
          sed -i "s/${BASE_VERSION}/${PATCH_VERSION}/g" \
            META-INF/MANIFEST.MF \
            META-INF/maven/org.eclipse.jetty/jetty-http/pom.properties \
            META-INF/maven/org.eclipse.jetty/jetty-http/pom.xml
          jar cfm "${OUT_JAR}" META-INF/MANIFEST.MF -C "${WORK_DIR}" .
          echo "OUT_JAR=${OUT_JAR}" >> "${GITHUB_ENV}"
          ls -lh "${OUT_JAR}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jetty-http-${{ env.PATCH_VERSION }}
          path: ${{ env.OUT_JAR }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PATCH_VERSION }}
          name: v${{ env.PATCH_VERSION }}
          files: ${{ env.OUT_JAR }}
          generate_release_notes: true
